<div class="card-container">

    <!-- Barre de Titre -->
    <div class="metal-frame top-bar">
        <div class="rivet"></div>
        <div class="rivet"></div>
        <div class="rivet"></div>
        <div class="rivet"></div>
        <div class="inner-box">
            <div class="item-name">{{item.name}}</div>
            <i class="fas fa-cog gear-icon"></i>
        </div>
    </div>

    <!-- Illustration -->
    <div class="metal-frame image-box">
        <!-- L'URL de l'image est dynamique. Si elle est vide, la case reste noire -->
        <div class="inner-box" style="background-image: url('{{item.imageUrl}}');"></div>
    </div>

    <!-- Tableau des effets -->
    <div class="bottom-section">
        <!-- Rivets extérieurs de la zone tableau -->
        <div class="rivet side-rivet sr-1"></div>
        <div class="rivet side-rivet sr-2"></div>
        <div class="rivet side-rivet sr-3"></div>
        <div class="rivet side-rivet right sr-1"></div>
        <div class="rivet side-rivet right sr-2"></div>
        <div class="rivet side-rivet right sr-3"></div>

        <div class="table-frame">
            <div class="stats-table">

                <!-- Ligne d'En-tête (Icônes + Texte) -->
                <div class="table-header" style="display: contents;">
                    <div class="cell"><i class="fa-solid fa-hand"></i></div>
                    <div class="cell"><i class="fa-solid fa-crosshairs"></i></div>
                    <div class="cell"><i class="fa-solid fa-dice"></i></div>
                    <div class="cell"><i class="fa-solid fa-gas-pump"></i></div>
                    <div class="cell header-effect">effet</div>
                </div>

                <!-- Lignes de stats générées dynamiquement -->
                {{#each item.effects}}
                <div class="table-row" style="display: contents;">
                    <div class="cell data-val">{{this.melee}}</div>
                    <div class="cell data-val">{{this.ranged}}</div>
                    <div class="cell data-val">{{this.dice}}</div>
                    <div class="cell data-val">{{this.ammo}}</div>
                    <div class="cell data-val effect-text">{{this.description}}</div>
                </div>
                {{/each}}

            </div>
        </div>
    </div>

</div>
