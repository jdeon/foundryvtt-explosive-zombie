<div class="tab edit" data-group="primary" data-tab="edit">
    <div class="classic-form">

        <!-- Section Identité -->
        <fieldset class="form-section">
            <legend><i class="fas fa-tag"></i> Identité & Apparence</legend>
            <div class="form-group">
                <label>Nom de l'Objet</label>
                <div class="form-fields">
                    <input type="text" name="name" value="{{data.name}}" placeholder="Nom de l'objet" />
                </div>
            </div>
            <div class="form-group">
                <label>Image / Icone</label>
                <div class="form-fields flexrow">
                    <file-picker type="image" name="img" value="{{data.img}}"
                        placeholder="icons/svg/item-bag.svg"></file-picker>
                </div>
            </div>
            <div class="form-grid grid-4col">
                <div class="form-group">
                    <label>Emplacements Requis (A)</label>
                    <input type="number" name="system.requiredSlots" value="{{system.requiredSlots}}" />
                </div>
                <div class="form-group">
                    <label>Capacité Chargeur</label>
                    <input type="number" name="system.munitions.capacity"
                        value="{{system.munitions.capacity}}" />
                </div>
                <div class="form-group">
                    <label>Munitions Chargées</label>
                    <input type="number" name="system.munitions.loadAmmo"
                        value="{{system.munitions.loadAmmo}}" />
                </div>
                <div class="form-group">
                    <label>Munitions Restantes</label>
                    <input type="number" name="system.munitions.remainingAmmo"
                        value="{{system.munitions.remainingAmmo}}" />
                </div>
            </div>
        </fieldset>

        <!-- Section Effets Actifs -->
        <fieldset class="form-section">
            <legend class="flexrow flex-between">
                <span><i class="fas fa-bolt"></i> Effets Actifs</span>
                <button type="button" class="effect-control btn-add" data-action="add"
                    data-type="activeEffects"><i class="fas fa-plus"></i> Ajouter un effet</button>
            </legend>
            <div class="effects-list-edit">
                {{#each system.activeEffects}}
                <div class="effect-edit-row"
                    style="display: grid; grid-template-columns: 1fr 1fr 1fr 1fr 2fr 30px; gap: 6px; margin-bottom: 8px; align-items: center;">
                    <input type="text" name="system.activeEffects.{{@index}}.actionNumber"
                        value="{{this.actionNumber}}" placeholder="Nombre Action" />
                    <input type="text" name="system.activeEffects.{{@index}}.threshold"
                        value="{{this.threshold}}" placeholder="Seuil" />
                    <input type="text" name="system.activeEffects.{{@index}}.dice" value="{{this.dice}}"
                        placeholder="Dés" />
                    <input type="text" name="system.activeEffects.{{@index}}.ammo" value="{{this.ammo}}"
                        placeholder="Munitions" />
                    <input type="text" name="system.activeEffects.{{@index}}.description"
                        value="{{this.description}}" placeholder="Effet / Description" />
                    <a class="effect-control btn-del" data-action="delete" data-type="activeEffects"
                        data-index="{{@index}}" title="Supprimer"><i class="fas fa-trash"></i></a>
                </div>
                {{else}}
                <p class="empty-msg">Aucun effet actif. Cliquez sur "Ajouter un effet".</p>
                {{/each}}
            </div>
        </fieldset>

        <!-- Section Effets Passifs -->
        <fieldset class="form-section">
            <legend class="flexrow flex-between">
                <span><i class="fas fa-shield-alt"></i> Effets Passifs</span>
                <button type="button" class="effect-control btn-add" data-action="add"
                    data-type="passiveEffects"><i class="fas fa-plus"></i> Ajouter un effet</button>
            </legend>
            <div class="effects-list-edit">
                {{#each system.passiveEffects}}
                <div class="effect-edit-row"
                    style="display: flex; gap: 8px; margin-bottom: 8px; align-items: center;">
                    <input type="text" name="system.passiveEffects.{{@index}}.description"
                        value="{{this.description}}" placeholder="Description de l'effet passif" />
                    <a class="effect-control btn-del" data-action="delete" data-type="passiveEffects"
                        data-index="{{@index}}" title="Supprimer"><i class="fas fa-trash"></i></a>
                </div>
                {{else}}
                <p class="empty-msg">Aucun effet passif. Cliquez sur "Ajouter un effet".</p>
                {{/each}}
            </div>
        </fieldset>

    </div>
</div>
