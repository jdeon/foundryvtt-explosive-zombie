<div class="zombie-sheet-content">
    <header class="zombie-header">
        <div class="zombie-portrait-box">
            <img class="profile-img" src="{{portraitUrl}}" data-edit="img" title="{{actor.name}}" />
        </div>
        <div class="zombie-title-box">
            <label class="zombie-label">{{localize "zombieSheet.nameLabel"}}</label>
            <input class="zombie-name-input" name="name" type="text" value="{{actor.name}}" placeholder="{{localize "zombieSheet.namePlaceholder"}}" />
        </div>
    </header>

    <div class="zombie-stats-grid">
        <div class="zombie-stat-card hp-card">
            <div class="stat-card-title"><i class="fas fa-heartbeat"></i> {{localize "zombieSheet.hp"}}</div>
            <div class="stat-card-inputs">
                <input type="number" name="system.hp.value" value="{{system.hp.value}}" min="0" placeholder="{{localize 'common.current'}}" />
                <span class="sep">/</span>
                <input type="number" name="system.hp.max" value="{{system.hp.max}}" min="0" placeholder="{{localize 'common.max'}}" />
            </div>
        </div>

        <div class="zombie-stat-card">
            <div class="stat-card-title"><i class="fas fa-running"></i> {{localize "zombieSheet.speed"}}</div>
            <div class="stat-card-inputs">
                <input type="number" name="system.speed" value="{{system.speed}}" min="0" />
            </div>
        </div>

        <div class="zombie-stat-card">
            <div class="stat-card-title"><i class="fas fa-bolt"></i> {{localize "zombieSheet.actionNumber"}}</div>
            <div class="stat-card-inputs">
                <input type="number" name="system.actionNumber" value="{{system.actionNumber}}" min="0" />
            </div>
        </div>

        <div class="zombie-stat-card">
            <div class="stat-card-title"><i class="fas fa-bullseye"></i> {{localize "zombieSheet.thresholdDice"}}</div>
            <div class="stat-card-inputs">
                <input type="number" name="system.thresholdDice" value="{{system.thresholdDice}}" min="1" max="6" />
            </div>
        </div>

        <div class="zombie-stat-card">
            <div class="stat-card-title"><i class="fas fa-dice-d6"></i> {{localize "zombieSheet.diceNumber"}}</div>
            <div class="stat-card-inputs">
                <input type="number" name="system.diceNumber" value="{{system.diceNumber}}" min="1" />
            </div>
        </div>
    </div>

    <div class="zombie-action-bar">
        <button type="button" class="zombie-roll-btn"><i class="fas fa-dice"></i> {{localize "zombieSheet.rollAction"}}</button>
    </div>

    <div class="zombie-notes-section">
        <label class="notes-label"><i class="fas fa-sticky-note"></i> {{localize "zombieSheet.notes"}}</label>
        <textarea name="system.notes" rows="6" placeholder="{{localize "zombieSheet.notesPlaceholder"}}">{{system.notes}}</textarea>
    </div>
</div>
